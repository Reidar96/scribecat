name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.22.14'
        required: true

# A tag pushed twice (or re-pushed) would otherwise start a second run that
# writes into the very same GitHub release as the first one, from four jobs at
# once. Not cancel-in-progress: the release is published before the portable
# zip is uploaded, so an abort mid-run can leave a live release with an
# incomplete asset set — including the .sig files the updater depends on.
# Queueing the second run instead lets the first finish untouched.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libasound2-dev: cpal (voice input); libclang-dev/cmake: whisper-rs build
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libclang-dev cmake

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'ScribeCat ${{ env.RELEASE_TAG }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      # The portable build is the very same binary the installer ships, plus
      # the marker file that makes it keep its data next to itself. Assembled
      # here rather than by tauri-action, which only produces installer
      # bundles. `.scribecat/app` is not created here — the app creates it on
      # first run, and Compress-Archive would drop an empty directory anyway.
      - name: Package portable build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $version = $tag.TrimStart("v")
          $staging = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path "$staging/.scribecat" | Out-Null

          Copy-Item "src-tauri/target/release/scribecat.exe" "$staging/ScribeCat.exe"
          Copy-Item "packaging/portable/README.txt" "$staging/README.txt"
          Set-Content -Path "$staging/.scribecat/portable" -Encoding utf8 -Value @(
            "This file switches ScribeCat into portable mode: it keeps its",
            "settings in .scribecat/app next to the executable instead of in",
            "your Windows user profile. Delete it to go back to the default.",
            "The contents of this file are never read."
          )

          $archive = "ScribeCat_${version}_portable.zip"
          Compress-Archive -DestinationPath $archive -Force -Path "$staging/ScribeCat.exe", "$staging/README.txt", "$staging/.scribecat"
          gh release upload "$tag" $archive --clobber
