name: Dispatch ScribeCat 0.24.4 release

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: startsWith(github.event.head_commit.message, 'Dispatch ScribeCat 0.24.4 release')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f version=0.24.4
