name: Publish ScribeCat 1.3.0

# One-time bootstrap for this release. The existing packaging workflows do
# the actual builds; this job only creates the tag and dispatches those jobs.
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.3.0.yml]

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release and start native and container builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = "1.3.0"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; no duplicate builds."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "ScribeCat $tag" --notes-file <(sed -n '/^## \[1.3.0\]/,/^## \[1.2.8\]/{/^## \[1.2.8\]/d;p;}' CHANGELOG.md) --latest
          gh workflow run release.yml --ref main -f version="$version"
          gh workflow run release-server.yml --ref main -f version="$version"
