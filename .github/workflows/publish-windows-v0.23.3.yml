name: Publish Windows v0.23.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-windows-v0.23.3.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout v0.23.3
        uses: actions/checkout@v7
        with:
          ref: v0.23.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Windows release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.23.3
          releaseName: 'ScribeCat v0.23.3'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Package portable build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "0.23.3"
          $staging = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path "$staging/.scribedog" | Out-Null

          Copy-Item "src-tauri/target/release/scribedog.exe" "$staging/ScribeDog.exe"
          Copy-Item "packaging/portable/README.txt" "$staging/README.txt"
          Set-Content -Path "$staging/.scribedog/portable" -Encoding utf8 -Value @(
            "This file switches ScribeDog into portable mode: it keeps its",
            "settings in .scribedog/app next to the executable instead of in",
            "your Windows user profile. Delete it to go back to the default.",
            "The contents of this file are never read."
          )

          $archive = "ScribeDog_${version}_portable.zip"
          Compress-Archive -DestinationPath $archive -Force -Path "$staging/ScribeDog.exe", "$staging/README.txt", "$staging/.scribedog"
          gh release upload "v0.23.3" $archive --clobber
