name: Publish ScribeCat 0.24.4 tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'Release ScribeCat 0.24.4')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish release tag
        run: |
          test "$(node -p "require('./package.json').version")" = "0.24.4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v0.24.4 "$GITHUB_SHA"
          git push origin refs/tags/v0.24.4
