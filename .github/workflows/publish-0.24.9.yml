name: Publish ScribeCat 0.24.9

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.event.before == 'c4de2d5f87781fb09efaa6585f9efb50d94f63ca'
    runs-on: ubuntu-latest
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.24.9" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v0.24.9' \
              -f sha='c4de2d5f87781fb09efaa6585f9efb50d94f63ca'
          fi

      - name: Dispatch release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" -f version=0.24.9
