name: ScribeCat rebrand pass

on:
  push:
    branches:
      - scribecat-rework

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: scribecat-rework

      - name: Rebrand tracked text files
        shell: python
        run: |
          import pathlib
          import subprocess

          excluded = {
              "LICENSE",
              "THIRD_PARTY_LICENSES.md",
              "CHANGELOG.md",
              ".github/workflows/scribecat-rebrand.yml",
          }
          allowed = {
              ".ts", ".tsx", ".js", ".mjs", ".json", ".md", ".yml", ".yaml",
              ".toml", ".rs", ".html", ".css", ".sh", ".txt", ".svg"
          }

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          changed = 0

          for raw in files:
              if raw in excluded:
                  continue
              path = pathlib.Path(raw)
              if path.suffix.lower() not in allowed and path.name not in {".env.example", "Dockerfile"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              updated = (
                  text
                  .replace("SCRIBEDOG", "SCRIBECAT")
                  .replace("ScribeDog", "ScribeCat")
                  .replace("scribedog", "scribecat")
              )

              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed += 1

          print(f"Rebranded {changed} files")

      - name: Commit rebrand
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand ScribeCat internals [skip ci]"
          git push origin HEAD:scribecat-rework
