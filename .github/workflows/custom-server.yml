name: ScribeCat server image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build web app
        run: npm run build:web

      - name: Test and build server
        run: |
          cd server
          npm ci
          npm test
          npm run build

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t scribecat-server:test .

  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ScribeCat server image
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMAGE=ghcr.io/reidar96/scribecat-server

          docker build -f server/Dockerfile -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"

          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists; leaving the versioned tag unchanged."
          else
            docker tag "$IMAGE:latest" "$IMAGE:$VERSION"
            docker push "$IMAGE:$VERSION"
          fi

      - name: Create GitHub release for a new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists."
          else
            gh release create "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "ScribeCat $VERSION" \
              --generate-notes
          fi
