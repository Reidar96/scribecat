name: ScribeCat server image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build web app
        run: npm run build:web

      - name: Test and build server
        run: |
          cd server
          npm ci
          npm test
          npm run build

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t scribecat-server:test .

  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ScribeCat server image
        run: |
          IMAGE=ghcr.io/reidar96/scribecat-server

          # main owns the moving latest tag. Exact version tags are published
          # by release-server.yml as a multi-arch manifest.
          docker build -f server/Dockerfile -t "$IMAGE:latest" .
          docker push "$IMAGE:latest"

      - name: Create or refresh GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NOTES_FILE=".github/release-notes/$VERSION.md"

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists."

            if [ -f "$NOTES_FILE" ]; then
              gh release edit "v$VERSION" \
                --title "ScribeCat $VERSION" \
                --notes-file "$NOTES_FILE"
            fi

            ASSET_COUNT=$(gh release view "v$VERSION" --json assets --jq '.assets | length')
            if [ "$ASSET_COUNT" -eq 0 ]; then
              echo "desktop_dispatch=true" >> "$GITHUB_OUTPUT"
            else
              echo "desktop_dispatch=false" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "v$VERSION" \
                --target "$GITHUB_SHA" \
                --title "ScribeCat $VERSION" \
                --notes-file "$NOTES_FILE"
            else
              gh release create "v$VERSION" \
                --target "$GITHUB_SHA" \
                --title "ScribeCat $VERSION" \
                --generate-notes
            fi
            echo "desktop_dispatch=true" >> "$GITHUB_OUTPUT"
          fi

          SERVER_IMAGE=ghcr.io/reidar96/scribecat-server
          SERVER_MANIFEST=$(docker manifest inspect "$SERVER_IMAGE:$VERSION" 2>/dev/null || true)
          if printf '%s' "$SERVER_MANIFEST" | grep -q '"manifests"'; then
            echo "server_dispatch=false" >> "$GITHUB_OUTPUT"
          else
            # Missing tags and legacy single-architecture tags both need the
            # versioned multi-arch release workflow.
            echo "server_dispatch=true" >> "$GITHUB_OUTPUT"
          fi

      # A tag created by GITHUB_TOKEN does not emit another workflow event.
      # Dispatch explicitly so the desktop assets and multi-arch server image
      # are actually built for the version we just published.
      - name: Dispatch versioned release workflows
        if: steps.release.outputs.desktop_dispatch == 'true' || steps.release.outputs.server_dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKTOP_DISPATCH: ${{ steps.release.outputs.desktop_dispatch }}
          SERVER_DISPATCH: ${{ steps.release.outputs.server_dispatch }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [ "$DESKTOP_DISPATCH" = "true" ]; then
            gh workflow run release.yml --ref main -f version="$VERSION"
          fi

          if [ "$SERVER_DISPATCH" = "true" ]; then
            gh workflow run release-server.yml --ref main -f version="$VERSION"
          fi
