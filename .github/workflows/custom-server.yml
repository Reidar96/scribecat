name: Custom server image

on:
  push:
    branches:
      - main
      - per-folder-attachments
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f server/Dockerfile -t scribedog-custom:test .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push custom server image
        run: |
          docker build -f server/Dockerfile \
            -t ghcr.io/reidar96/scribedog-server:attachments \
            -t ghcr.io/reidar96/scribedog-server:0.15.1-attachments \
            .
          docker push ghcr.io/reidar96/scribedog-server:attachments
          docker push ghcr.io/reidar96/scribedog-server:0.15.1-attachments
