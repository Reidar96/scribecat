name: ScribeCat server image

on:
  push:
    branches:
      - main
      - scribecat-rework
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build web app
        run: npm run build:web

      - name: Test and build server
        run: |
          cd server
          npm ci
          npm test
          npm run build

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t scribecat-server:test .

  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ScribeCat server image
        run: |
          docker build -f server/Dockerfile \
            -t ghcr.io/reidar96/scribecat-server:latest \
            -t ghcr.io/reidar96/scribecat-server:0.15.1 \
            .
          docker push ghcr.io/reidar96/scribecat-server:latest
          docker push ghcr.io/reidar96/scribecat-server:0.15.1
