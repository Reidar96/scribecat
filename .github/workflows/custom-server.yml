name: ScribeCat server image

on:
  push:
    branches:
      - main
      - scribecat-clean
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f server/Dockerfile -t scribecat:test .

  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ScribeCat server image
        run: |
          docker build -f server/Dockerfile \
            -t ghcr.io/reidar96/scribecat-server:latest \
            -t ghcr.io/reidar96/scribecat-server:0.15.1 \
            .
          docker push ghcr.io/reidar96/scribecat-server:latest
          docker push ghcr.io/reidar96/scribecat-server:0.15.1
