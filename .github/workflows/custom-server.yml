name: Restore ScribeCat 0.15.1

on:
  push:
    branches:
      - restore-0.15.1

permissions:
  contents: write
  packages: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact 0.15.1 source
        uses: actions/checkout@v4
        with:
          ref: fdb70b9e4e0af91abb0001c47d57bad7efc4311d

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Build web app
        run: npm run build:web

      - name: Test and build server
        run: |
          cd server
          npm ci
          npm test
          npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore immutable 0.15.1 image
        run: |
          docker build -f server/Dockerfile \
            -t ghcr.io/reidar96/scribecat-server:0.15.1 \
            .
          docker push ghcr.io/reidar96/scribecat-server:0.15.1

      - name: Create historical GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.15.1 >/dev/null 2>&1; then
            echo "Release v0.15.1 already exists"
          else
            gh release create v0.15.1 \
              --target fdb70b9e4e0af91abb0001c47d57bad7efc4311d \
              --title "ScribeCat 0.15.1" \
              --notes "Stable ScribeCat baseline before the 0.16.0 usability update. This release preserves the version before Norwegian Bokmål, default auto-save, document editing lock, and shortcut disabling were added."
          fi
