name: Validate ScribeCat 0.24.9

on:
  push:
    branches:
      - release/0.24.9-pdf-zoom-fullscreen

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
