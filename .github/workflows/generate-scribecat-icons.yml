name: Generate ScribeCat desktop icons

on:
  push:
    branches:
      - scribecat-rework
    paths:
      - .github/workflows/generate-scribecat-icons.yml
      - src/assets/scribecat-icon.svg

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: scribecat-rework

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate desktop icons
        run: npx tauri icon src/assets/scribecat-icon.svg

      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/icons
          if git diff --cached --quiet; then
            echo "Icons already current."
            exit 0
          fi
          git commit -m "Generate ScribeCat desktop icons"
          git push origin HEAD:scribecat-rework
