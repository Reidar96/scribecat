name: Package corrected ScribeCat 1.3.15
on:
  push:
    branches: [main]
    paths: [.github/workflows/package-corrected-1.3.15.yml]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Build from corrected main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml --repo Reidar96/scribecat --ref main -f version=1.3.15 -f source_ref=main
          gh workflow run release-server.yml --repo Reidar96/scribecat --ref main -f version=1.3.15 -f source_ref=main
