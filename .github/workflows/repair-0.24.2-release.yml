name: Repair ScribeCat 0.24.2 release tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: startsWith(github.event.head_commit.message, 'Repair ScribeCat 0.24.2 release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move v0.24.2 tag to repaired commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(node -p "require('./package.json').version")" = "0.24.2"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v0.24.2 "$GITHUB_SHA"
          git push origin refs/tags/v0.24.2 --force

          # The failed desktop build should not have uploaded assets, but
          # clear any partial files before the normal main release workflow
          # dispatches a clean rebuild from the repaired tag.
          gh release view v0.24.2 --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              [ -z "$asset" ] || gh release delete-asset v0.24.2 "$asset" --yes
            done
