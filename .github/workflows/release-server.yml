name: Release server image

# The server edition ships as a container image rather than an installer, but
# it carries the same version as the app (the web client is the app's own
# frontend), so it rides on the same tag as the desktop release.
#
# Only exact versions are published: no "latest", no moving major/minor tags.
# An operator pins one version, and an upgrade is a deliberate edit of the
# compose file, which is also what makes the data-version downgrade check in
# the server meaningful.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push, e.g. 0.11.0'
        required: true

# A tag pushed twice starts a second build of the very same image tag, and the
# two then race on the ghcr push — which is how the v0.14.1 run sat there for
# 99 minutes before it was cancelled. Cancelling is safe here (unlike in
# release.yml): the push is atomic over the digest, so an aborted run leaves
# nothing half-published behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to ghcr.io as the repository itself; no secret needed for it.
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          manifest=$(node -p "require('./package.json').version")

          if [ "$version" != "$manifest" ]; then
            echo "Tag says $version but package.json says $manifest; bump the manifests first (see DOCS/RELEASING.md)." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two attempts, because the arm64 half is emulated: QEMU occasionally
      # dies with "uncaught target signal 4 (Illegal instruction)" inside
      # `npm ci`, and the build then sits on that layer until someone cancels
      # it (v0.15.0 sat for 25 minutes; the retry finished in 8). The crash is
      # not reproducible — the same commit built cleanly on the next run — so
      # a second attempt is the fix, not a workaround for something in the
      # image. The first attempt's layers are in the gha cache by then, so the
      # retry only redoes what actually failed.
      #
      # continue-on-error rather than a failure gate: the second step decides
      # the job's outcome, and a first attempt that died must not colour the
      # run red when the retry succeeds. That red is what used to leave a
      # cancelled check on the release commit.
      - name: Build and push
        id: build
        continue-on-error: true
        # A QEMU crash does not fail the step, it wedges it: the layer never
        # finishes and the build would sit there until the job's own 6h limit.
        # Successful runs take 5-10 minutes, so 20 turns that wedge into a
        # failure the retry below can act on.
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with:
          # The whole repository: the image needs the frontend under /src as
          # well as /server (see server/Dockerfile).
          context: .
          file: server/Dockerfile
          # arm64 is not an afterthought here: a Raspberry Pi is the typical
          # box this runs on.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scribecat-server:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/scribecat-server:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pushing the same tag twice is safe: the registry addresses the image by
      # digest, so an identical rebuild replaces nothing and a failed attempt
      # leaves nothing half-published behind.
      - name: Build and push (retry)
        if: steps.build.outcome == 'failure'
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scribecat-server:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/scribecat-server:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
