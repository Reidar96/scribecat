name: ScribeCat cleanup pass

on:
  push:
    branches:
      - scribecat-rework

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: scribecat-rework

      - name: Remove visible AI tools
        shell: python
        run: |
          import pathlib, re

          def read(path):
              return pathlib.Path(path).read_text(encoding="utf-8")

          def write(path, text):
              pathlib.Path(path).write_text(text, encoding="utf-8")

          # Settings navigation: keep all languages and normal app/folder settings,
          # remove AI / Assistants / Knowledge Base entries entirely.
          write("src/components/settings/settingsTabs.ts", '''import { platform } from "@/platform";
          import type { PlatformFeatures } from "@/platform/types";

          export type SettingsTab =
            | "application"
            | "appearance"
            | "fonts"
            | "shortcuts"
            | "versioning"
            | "vault"
            | "account"
            | "server";

          export type SettingsGroup = "application" | "folder";

          export const SETTINGS_NAV: { group: SettingsGroup; tabs: SettingsTab[] }[] = [
            { group: "application", tabs: ["application", "appearance", "fonts", "shortcuts", "account", "server"] },
            { group: "folder", tabs: ["versioning", "vault"] }
          ];

          const SETTINGS_TAB_FEATURE: Partial<Record<SettingsTab, keyof PlatformFeatures>> = {
            account: "session",
            server: "remoteVaults"
          };

          export function isSettingsTabAvailable(tab: SettingsTab): boolean {
            const feature = SETTINGS_TAB_FEATURE[tab];
            return feature === undefined || platform.features[feature];
          }

          export const SETTINGS_NAV_VISIBLE: { group: SettingsGroup; tabs: SettingsTab[] }[] = SETTINGS_NAV.map(
            ({ group, tabs }) => ({ group, tabs: tabs.filter(isSettingsTabAvailable) })
          ).filter(({ tabs }) => tabs.length > 0);

          export const SETTINGS_TAB_ORDER: SettingsTab[] = SETTINGS_NAV_VISIBLE.flatMap((group) => group.tabs);

          export const SELF_SAVING_TABS: SettingsTab[] = [
            "fonts",
            "shortcuts",
            "versioning",
            "vault",
            "account",
            "server"
          ];

          export const SETTINGS_TAB_LABEL_KEY: Record<SettingsTab, string> = {
            application: "settingsDialog.tabApplication",
            appearance: "settingsDialog.tabAppearance",
            fonts: "settingsDialog.tabFonts",
            shortcuts: "settingsDialog.tabShortcuts",
            versioning: "settingsDialog.tabVersioning",
            vault: "settingsDialog.tabVault",
            account: "settingsDialog.tabAccount",
            server: "settingsDialog.tabServer"
          };

          export const SETTINGS_GROUP_LABEL_KEY: Record<SettingsGroup, string> = {
            application: "settingsDialog.groupApplication",
            folder: "settingsDialog.groupFolder"
          };
          '''.replace("          ", ""))

          # Right-click selection menu: copying only, no AI rewrite.
          write("src/components/editor/SelectionContextMenu.tsx", '''import { useTranslation } from "react-i18next";

          import { ContextMenuSurface } from "@/components/fileTree/ContextMenuSurface";
          import { formatFixedEditorShortcut } from "@/lib/shortcuts/fixed";

          export type SelectionContextMenuState = { x: number; y: number };

          type SelectionContextMenuProps = SelectionContextMenuState & {
            onCopyFormatted: () => void;
            onCopyMarkdown: () => void;
            onCopyPlainText: () => void;
            onClose: () => void;
          };

          export function SelectionContextMenu({
            x,
            y,
            onCopyFormatted,
            onCopyMarkdown,
            onCopyPlainText,
            onClose
          }: SelectionContextMenuProps) {
            const { t } = useTranslation();

            const items = [
              {
                id: "copyFormatted",
                label: t("editorContextMenu.copyFormatted"),
                keys: formatFixedEditorShortcut(t, "copyFormatted"),
                run: onCopyFormatted
              },
              {
                id: "copyMarkdown",
                label: t("editorContextMenu.copyMarkdown"),
                keys: formatFixedEditorShortcut(t, "copyMarkdown"),
                run: onCopyMarkdown
              },
              {
                id: "copyPlainText",
                label: t("editorContextMenu.copyPlainText"),
                keys: formatFixedEditorShortcut(t, "copyPlainText"),
                run: onCopyPlainText
              }
            ];

            return (
              <ContextMenuSurface x={x} y={y} onMouseDown={(event) => event.preventDefault()}>
                {items.map((item) => (
                  <button
                    key={item.id}
                    type="button"
                    role="menuitem"
                    className="file-tree-context-menu__item"
                    onClick={() => {
                      onClose();
                      item.run();
                    }}
                  >
                    <span className="file-tree-context-menu__label">{item.label}</span>
                    <kbd className="file-tree-context-menu__keys">{item.keys}</kbd>
                  </button>
                ))}
              </ContextMenuSurface>
            );
          }
          '''.replace("          ", ""))

          # Toolbar: drop AI/chat/model controls and their props/imports.
          p = "src/components/Toolbar.tsx"
          c = read(p)
          for name in ["  Brain,\n","  MessagesSquare,\n","  PawPrint,\n","  Sparkles,\n","  SpellCheck,\n"]:
              c = c.replace(name, "")
          for line in [
              'import { useLayoutMode } from "@/hooks/useLayoutMode";\n',
              'import { useAiModelsStore } from "@/store/useAiModelsStore";\n',
              'import { useAiSettingsStore } from "@/store/useAiSettingsStore";\n',
              'import { useChatStore } from "@/store/useChatStore";\n'
          ]:
              c = c.replace(line, "")
          c = c.replace("  onAiRequest: () => void;\n", "")
          c = c.replace("  onAiCheckRequest: () => void;\n", "")
          c = c.replace("  onAiSettingsRequest: () => void;\n", "")
          c = re.sub(r'\nconst OPEN_AI_SETTINGS_VALUE = "__open-ai-settings__";\n', '\n', c)
          c = re.sub(r'\nfunction AiMobileMenu\([\s\S]*?\n(?=type MissingDictionary)', '\n', c)
          c = c.replace("  onAiRequest,\n", "").replace("  onAiCheckRequest,\n", "").replace("  onAiSettingsRequest,\n", "")
          c = c.replace("  const hasSelection = !editor.state.selection.empty;\n", "")
          c = re.sub(r'  // On phone and tablet this button is the only chat toggle,[\s\S]*?  const layout = useLayoutMode\(\);\n', '', c)
          c = re.sub(
              r'\n      <div className="editor-toolbar__group editor-toolbar__group--ai">[\s\S]*?</div>\n\n      <div className="editor-toolbar__separator" aria-hidden="true" />',
              '',
              c,
              count=1
          )
          write(p, c)

          # Shortcuts: remove all AI/chat/dictation actions and the AI category.
          p = "src/lib/shortcuts/definitions.ts"
          c = read(p)
          c = c.replace('export type ShortcutCategory = "app" | "ai" | "format";', 'export type ShortcutCategory = "app" | "format";')
          for ident in ["toggleChat","newChat","aiEditDialog","aiVoiceDialog","dictation","aiCheckDialog"]:
              c = c.replace(f'  | "{ident}"\n', "")
              c = re.sub(r'\n  \{\n    id: "'+re.escape(ident)+r'",[\s\S]*?\n  \},', '', c, count=1)
          c = c.replace('export const SHORTCUT_CATEGORY_ORDER: ShortcutCategory[] = ["app", "ai", "format"];',
                        'export const SHORTCUT_CATEGORY_ORDER: ShortcutCategory[] = ["app", "format"];')
          write(p, c)

          p = "src/components/ShortcutsSettings.tsx"
          c = read(p)
          c = c.replace('''\n  {
    id: "aiEditContextMenu",
    keys: [{ special: "rightClick" }],
    descriptionKey: "shortcutsDialog.items.aiEditDialog"
  },''', "")
          c = c.replace('''\n  { id: "aiSubmit", keys: [{ mod: "ctrl" }, { special: "enter" }], descriptionKey: "shortcutsDialog.items.aiSubmit" },''', "")
          c = c.replace("Like fonts, assistants and versioning, its\n * bindings apply immediately through useShortcutsStore, without the AI\n * settings' save button.",
                        "Like fonts and versioning, its bindings apply immediately through useShortcutsStore.")
          write(p, c)

          p = "src/hooks/useGlobalShortcuts.ts"
          c = read(p).replace('import { useChatStore } from "@/store/useChatStore";\n', "")
          c = re.sub(r'\n        case "toggleChat":[\s\S]*?\n          return;\n        case "newChat": \{[\s\S]*?\n          return;\n        \}', '', c, count=1)
          write(p, c)

          # Document panel: remove AI progress chip and AI props passed to Editor.
          p = "src/components/app/DocumentPanel.tsx"
          c = read(p)
          c = c.replace("  Square\n", "")
          for line in [
              "  isAiLoading: boolean;\n",
              "  onAiLoadingChange: (isLoading: boolean) => void;\n",
              "  onAiPendingChange: (isPending: boolean) => void;\n",
              "  onAiSettingsRequest: () => void;\n",
              "  isAiLoading,\n",
              "  onAiLoadingChange,\n",
              "  onAiPendingChange,\n",
              "  onAiSettingsRequest,\n"
          ]:
              c = c.replace(line, "")
          c = re.sub(r'\n              \{isAiLoading \? \([\s\S]*?\n              \) : null\}', '', c, count=1)
          for line in [
              "                onAiLoadingChange={onAiLoadingChange}\n",
              "                onAiPendingChange={onAiPendingChange}\n",
              "                onAiSettingsRequest={onAiSettingsRequest}\n"
          ]:
              c = c.replace(line, "")
          write(p, c)

          # Editor: no AI actions in toolbar, context menu, shortcuts or dialogs.
          p = "src/components/Editor.tsx"
          c = read(p)
          c = c.replace('import { AiCheckDialog } from "@/components/AiCheckDialog";\n', "")
          c = c.replace('import { AiRewriteDialog } from "@/components/AiRewriteDialog";\n', "")
          c = c.replace("  onAiSettingsRequest: () => void;\n", "")
          c = c.replace("    onAiSettingsRequest,\n", "")
          c = re.sub(r'\n          case "aiCheckDialog":[\s\S]*?\n            return true;', '', c, count=1)
          c = re.sub(r'\n          case "aiVoiceDialog":[\s\S]*?\n            break;', '', c, count=1)
          c = re.sub(r'\n          case "aiEditDialog":[\s\S]*?\n            break;', '', c, count=1)
          c = re.sub(r'\n          case "dictation":[\s\S]*?\n            break;', '', c, count=1)
          c = c.replace("      onAiRequest={ai.openAiDraftFromSelection}\n", "")
          c = c.replace("      onAiCheckRequest={ai.runAiGrammarCheck}\n", "")
          c = c.replace("      onAiSettingsRequest={onAiSettingsRequest}\n", "")
          c = c.replace("          canAiEdit={Boolean(editor?.isEditable) && !ai.isDiffActive()}\n", "")
          c = c.replace("          onAiEdit={ai.openAiDraftFromSelection}\n", "")
          c = re.sub(r'\n      <AiRewriteDialog[\s\S]*?\n      />\n', '\n', c, count=1)
          c = re.sub(r'\n      <AiCheckDialog[\s\S]*?\n      />\n', '\n', c, count=1)
          write(p, c)

          # Disable AI OCR import: ordinary image insertion remains untouched.
          p = "src/lib/import/convert.ts"
          c = read(p)
          c = c.replace('export const CONVERT_IMAGE_EXTENSIONS = ["png", "jpg", "jpeg", "gif", "webp"] as const;',
                        'export const CONVERT_IMAGE_EXTENSIONS = [] as const;')
          write(p, c)

          p = "src/lib/import/importer.ts"
          c = read(p)
          c = re.sub(r'\n      if \(kind === "image"\) \{[\s\S]*?\n      \}', '', c, count=1)
          write(p, c)

          # English is the first-run default.
          p = "src/i18n/index.ts"
          c = read(p).replace('const DEFAULT_LANGUAGE: SupportedLanguage = "de";',
                              'const DEFAULT_LANGUAGE: SupportedLanguage = "en";')
          write(p, c)

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove visible AI tools from ScribeCat [skip ci]"
            git push origin HEAD:scribecat-rework
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

      - name: Build server
        run: |
          cd server
          npm ci
          npm run build
