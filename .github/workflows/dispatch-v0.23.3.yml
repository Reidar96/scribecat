name: Dispatch v0.23.3 release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-v0.23.3.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start desktop and server releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo "${{ github.repository }}" --ref main -f version=0.23.3
          gh workflow run release-server.yml --repo "${{ github.repository }}" --ref main -f version=0.23.3
