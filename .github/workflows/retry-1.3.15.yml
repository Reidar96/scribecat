name: Retry ScribeCat 1.3.15 builds
on:
  push:
    branches: [main]
    paths: [.github/workflows/retry-1.3.15.yml]
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start corrected native and container builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml --repo Reidar96/scribecat --ref main -f version=1.3.15
          gh workflow run release-server.yml --repo Reidar96/scribecat --ref main -f version=1.3.15
