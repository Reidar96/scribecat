name: Publish ScribeCat 0.24.8

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Release ScribeCat 0.24.8')
    runs-on: ubuntu-latest
    steps:
      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.24.8" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v0.24.8' \
              -f sha="${GITHUB_SHA}"
          fi

      - name: Dispatch release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" -f version=0.24.8
