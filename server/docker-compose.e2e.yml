# Additions for the browser test run, on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#
# A scripted model (e2e/mock-llm) joins the stack as https://llm.e2e.internal,
# served by the same Caddy under a second site name, so the ScribeCat server
# forwards the app's AI requests to it exactly as it would to a real
# provider. Nothing here belongs in a real deployment.

services:
  scribecat:
    environment:
      SCRIBECAT_LLM_ALLOWED_HOSTS: llm.e2e.internal
      # The mock's certificate comes from Caddy's local CA, which the server
      # container does not trust. Test stack only.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"

  caddy:
    volumes:
      - ./e2e/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - llm.e2e.internal

  mock-llm:
    image: node:24-alpine
    restart: unless-stopped
    command: ["node", "/mock/server.mjs"]
    volumes:
      - ./e2e/mock-llm:/mock:ro
    expose:
      - "8080"
    ports:
      # The tests read the mock's request log through this port.
      - "${SCRIBECAT_MOCK_LLM_PORT:-9081}:8080"
