# Two ScribeDog instances on one host, one Caddy in front of both:
#
#   https://<host>/anna/   ->  scribedog-anna  (data in ./anna-data)
#   https://<host>/bob/    ->  scribedog-bob   (data in ./bob-data)
#
# Every instance is a separate container with its own data folder, password
# and session cookie (the cookie is scoped to the base path, so the two never
# see each other's). Add a third by copying one service block, one `handle`
# block in the Caddyfile and one data folder.
#
#   cp .env.example .env         # passwords, host name, ids
#   docker compose up -d --build
#
# The image is built from the repository like the single-instance file; to
# run a published image instead set SCRIBEDOG_IMAGE in .env.

x-scribedog: &scribedog
  build:
    context: ../../..
    dockerfile: server/Dockerfile
  image: ${SCRIBEDOG_IMAGE:-scribedog-server:0.12.0}
  restart: unless-stopped
  expose:
    - "3000"

services:
  scribedog-anna:
    <<: *scribedog
    environment:
      SCRIBEDOG_BASE_PATH: /anna
      SCRIBEDOG_INIT_PASSWORD: ${ANNA_INIT_PASSWORD:-}
      # Ideally a Linux user of its own per instance (see README): the
      # container hands ./anna-data to these ids and runs as them.
      PUID: ${ANNA_PUID:-1000}
      PGID: ${ANNA_PGID:-1000}
    volumes:
      - ./anna-data:/data

  scribedog-bob:
    <<: *scribedog
    environment:
      SCRIBEDOG_BASE_PATH: /bob
      SCRIBEDOG_INIT_PASSWORD: ${BOB_INIT_PASSWORD:-}
      PUID: ${BOB_PUID:-1001}
      PGID: ${BOB_PGID:-1001}
    volumes:
      - ./bob-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - scribedog-anna
      - scribedog-bob
    ports:
      - "${SCRIBEDOG_HTTP_PORT:-80}:80"
      - "${SCRIBEDOG_HTTPS_PORT:-443}:443"
      - "${SCRIBEDOG_HTTPS_PORT:-443}:443/udp"
    environment:
      SCRIBEDOG_SITE_ADDRESS: ${SCRIBEDOG_SITE_ADDRESS:-localhost}
      SCRIBEDOG_DEFAULT_SNI: ${SCRIBEDOG_DEFAULT_SNI:-${SCRIBEDOG_SITE_ADDRESS:-localhost}}
      SCRIBEDOG_TLS: ${SCRIBEDOG_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
