<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Your next idea starts here.</title><desc>Illustrative workflow with fictional sample content, not an application screenshot.</desc><g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#edf2eb" stroke="none"/><text x="48" y="57" font-size="16" fill="#306b54" font-weight="700">S C R I B E C A T</text><text x="48" y="108" font-size="36" fill="#193b30" font-weight="700">Your next idea starts here.</text><text x="48" y="144" font-size="18" fill="#384944" font-weight="400">A calm writing space. Familiar folders. Markdown underneath.</text><text x="48" y="733" font-size="11" fill="#62786b" font-weight="600">WORKFLOW ILLUSTRATION  •  FICTIONAL EXAMPLE CONTENT</text><rect x="48" y="182" width="1104" height="514" rx="16" fill="#fff" stroke="none"/><rect x="48" y="182" width="228" height="514" rx="16" fill="#e3ebe1" stroke="none"/><text x="72" y="222" font-size="23" fill="#193b30" font-weight="700">ScribeCat</text><rect x="68" y="245" width="188" height="34" rx="7" fill="#f6f8f3" stroke="none"/><text x="82" y="267" font-size="13" fill="#738475" font-weight="400">Search your notes…</text><text x="78" y="315" font-size="15" fill="#384944" font-weight="400">Start</text><text x="78" y="350" font-size="15" fill="#384944" font-weight="400">Calendar</text><text x="78" y="385" font-size="15" fill="#384944" font-weight="400">Graph</text><text x="78" y="420" font-size="15" fill="#384944" font-weight="400">Tasks</text><text x="74" y="468" font-size="11" fill="#6d806f" font-weight="700">MY WORKSPACE</text><text x="80" y="503" font-size="15" fill="#384944" font-weight="400">⌄  Projects</text><rect x="67" y="514" width="194" height="35" rx="6" fill="#c6dccb" stroke="none"/><text x="96" y="537" font-size="14" fill="#193b30" font-weight="600">A quieter workspace</text><text x="96" y="574" font-size="14" fill="#384944" font-weight="400">Research notes</text><text x="80" y="614" font-size="15" fill="#384944" font-weight="400">›  Journal</text><text x="80" y="651" font-size="15" fill="#384944" font-weight="400">›  Reading list</text><text x="304" y="219" font-size="13" fill="#7b867b" font-weight="400">Projects / A quieter workspace</text><path d="M276 236 L1152 236" stroke="#dce5df" stroke-width="1"/><text x="310" y="266" font-size="14" fill="#384944" font-weight="400">H1     B     I     U     • List     ☑     Link     Table</text><path d="M276 287 L1152 287" stroke="#dce5df" stroke-width="1"/><path d="M921 288 L921 696" stroke="#dce5df" stroke-width="1"/><text x="322" y="341" font-size="30" fill="#253e32" font-weight="700">A quieter workspace</text><text x="322" y="382" font-size="18" fill="#384944" font-weight="400">Good ideas need somewhere to grow.</text><text x="322" y="414" font-size="16" fill="#384944" font-weight="400">Keep the research, the plan and the next step together.</text><rect x="322" y="443" width="555" height="62" rx="8" fill="#eef4e8" stroke="none"/><text x="342" y="470" font-size="16" fill="#32684b" font-weight="600">A small goal for this week</text><text x="342" y="493" font-size="14" fill="#384944" font-weight="400">Make more room for writing — and less for busywork.</text><text x="322" y="550" font-size="23" fill="#253e32" font-weight="600">The plan</text><rect x="324" y="571" width="14" height="14" rx="3" fill="#fff" stroke="#8aa190"/><text x="352" y="584" font-size="15" fill="#384944" font-weight="400">Gather references and connect the useful notes</text><rect x="324" y="604" width="14" height="14" rx="3" fill="#fff" stroke="#8aa190"/><text x="352" y="617" font-size="15" fill="#384944" font-weight="400">Write the first draft</text><rect x="324" y="637" width="14" height="14" rx="3" fill="#fff" stroke="#8aa190"/><text x="352" y="650" font-size="15" fill="#384944" font-weight="400">Share the finished document</text><text x="944" y="328" font-size="11" fill="#778777" font-weight="700">DETAILS</text><text x="944" y="367" font-size="14" fill="#253e32" font-weight="600">Tags</text><rect x="941" y="383" width="94" height="27" rx="13" fill="#e7efdf" stroke="none"/><text x="954" y="402" font-size="13" fill="#384944" font-weight="400"># writing</text><text x="944" y="448" font-size="14" fill="#253e32" font-weight="600">Outline</text><text x="944" y="480" font-size="12" fill="#384944" font-weight="400">A quieter workspace</text><text x="956" y="509" font-size="12" fill="#384944" font-weight="400">The plan</text><text x="944" y="655" font-size="12" fill="#6b7e70" font-weight="400">Plain Markdown files</text></g></svg>